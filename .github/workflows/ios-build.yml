name: iOS Build and TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  GODOT_VERSION: "4.6.3"
  BUNDLE_ID: com.orehruoy.taptico
  PROJECT_NAME: Taptico
  XCODE_VERSION: "16.4"

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install Godot and export templates
        run: |
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl -L "$GODOT_URL" -o godot.zip
          unzip -q godot.zip
          GODOT_BIN="$(find . -maxdepth 3 -name Godot | head -1)"
          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN="$(find . -maxdepth 1 -name 'Godot*.app' | head -1)/Contents/MacOS/Godot"
          fi
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          TEMPLATE_DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"
          TPZ_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl -L "$TPZ_URL" -o templates.tpz
          unzip -qo templates.tpz -d "$TEMPLATE_DIR"
          if [ -d "$TEMPLATE_DIR/templates" ]; then
            mv "$TEMPLATE_DIR/templates/"* "$TEMPLATE_DIR/" || true
          fi

      - name: Build native iOS plugins
        run: |
          chmod +x native/build_plugins.sh
          native/build_plugins.sh

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATE_P12_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Install profile and write ExportOptions.plist
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PP_PATH=$(ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | head -1)
          if [ -z "$PP_PATH" ]; then
            echo "No provisioning profile was installed into the runner keychain/profile store."
            exit 1
          fi
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PP_PATH")")
          echo "GODOT_IOS_PROVISIONING_PROFILE_UUID_RELEASE=$UUID" >> "$GITHUB_ENV"
          echo "GODOT_IOS_PROVISIONING_PROFILE_UUID_DEBUG=$UUID" >> "$GITHUB_ENV"
          echo "PROVISIONING_PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Installed provisioning profile UUID: $UUID"
          cp ios/ExportOptions.plist ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :teamID ${{ secrets.APPLE_TEAM_ID }}" ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Set :provisioningProfiles:${BUNDLE_ID} $UUID" ExportOptions.plist
          plutil -lint ExportOptions.plist

      - name: Export Xcode project
        env:
          GODOT_IOS_PROVISIONING_PROFILE_UUID_RELEASE: ${{ env.GODOT_IOS_PROVISIONING_PROFILE_UUID_RELEASE }}
        run: |
          mkdir -p build/ios
          "$GODOT_BIN" --headless --path . --export-release "iOS" "build/ios/${PROJECT_NAME}.xcodeproj"

      - name: Overlay launch screen, privacy manifest, and App Icon
        run: |
          set -euo pipefail
          EXPORT_DIR="build/ios"
          cp -f ios/PrivacyInfo.xcprivacy "$EXPORT_DIR/PrivacyInfo.xcprivacy" || true
          find "$EXPORT_DIR" -name 'Launch Screen.storyboard' -o -name 'LaunchScreen.storyboard' | while read -r sb; do
            cp -f ios/LaunchScreen.storyboard "$sb"
          done
          ICONSET=$(find "$EXPORT_DIR" -type d -name 'AppIcon.appiconset' | head -1)
          if [ -n "$ICONSET" ]; then
            cp -f ios/AppIcon.appiconset/Icon-1024.png "$ICONSET/Icon-1024.png"
            cp -f ios/AppIcon.appiconset/Contents.json "$ICONSET/Contents.json"
          fi

      - name: Archive, clean derived data, export IPA
        run: |
          set -euo pipefail
          SCHEME="${PROJECT_NAME}"
          rm -rf build/DerivedData
          mkdir -p build/DerivedData build/export
          security find-identity -v -p codesigning
          xcodebuild \
            -project "build/ios/${PROJECT_NAME}.xcodeproj" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            clean archive \
            -archivePath "build/${PROJECT_NAME}.xcarchive" \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="${PROVISIONING_PROFILE_UUID}"
          xcodebuild -exportArchive \
            -archivePath "build/${PROJECT_NAME}.xcarchive" \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v2
        with:
          app-path: build/export/${{ env.PROJECT_NAME }}.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
